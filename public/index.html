<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRUD DynamoDB</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.container-box{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0px 0px 15px rgba(0,0,0,0.1);
    margin-top:50px;
}

.card-producto{
    margin-top:15px;
}

</style>

</head>
<body>

<div class="container">

    <div class="container-box">

        <h1 class="text-center mb-4">
            CRUD DynamoDB 🚀
        </h1>

        <div class="row">

            <div class="col-md-3">
                <input type="text" id="id" class="form-control" placeholder="ID">
            </div>

            <div class="col-md-5">
                <input type="text" id="nombre" class="form-control" placeholder="Nombre">
            </div>

            <div class="col-md-2">
                <input type="number" id="precio" class="form-control" placeholder="Precio">
            </div>

            <div class="col-md-2">
                <button onclick="crearProducto()" class="btn btn-primary w-100">
                    Crear
                </button>
            </div>

        </div>

        <hr>

        <h3>Productos</h3>

        <div id="listaProductos"></div>

    </div>

</div>

<script>

const API = '';

async function obtenerProductos() {

    const respuesta = await fetch(`${API}/productos`);

    const productos = await respuesta.json();

    const lista = document.getElementById('listaProductos');

    lista.innerHTML = '';

    productos.forEach(producto => {

        lista.innerHTML += `
        
        <div class="card card-producto">
            <div class="card-body">

                <h5 class="card-title">
                    ${producto.nombre}
                </h5>

                <p class="card-text">
                    <strong>ID:</strong> ${producto.id}
                </p>

                <p class="card-text">
                    <strong>Precio:</strong> $${producto.precio}
                </p>

                <button 
                    onclick="eliminarProducto('${producto.id}')"
                    class="btn btn-danger">
                    Eliminar
                </button>

            </div>
        </div>

        `;
    });
}

async function crearProducto() {

    const id = document.getElementById('id').value;
    const nombre = document.getElementById('nombre').value;
    const precio = document.getElementById('precio').value;

    const respuesta = await fetch(`${API}/productos`, {

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body: JSON.stringify({
            id,
            nombre,
            precio
        })
    });

    const data = await respuesta.json();

    alert(data.mensaje);

    obtenerProductos();
}

async function eliminarProducto(id) {

    await fetch(`${API}/productos/${id}`, {
        method:'DELETE'
    });

    obtenerProductos();
}

obtenerProductos();

</script>

</body>
</html>
